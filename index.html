<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>업비트 이평선 감시</title>
    <meta name="theme-color" content="#0b1120" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1120; --card: #131c31; --line: #1f2b45;
        --text: #e5ecf9; --muted: #8b9ac0;
        --up: #34d399; --down: #f87171; --near: #fbbf24;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0 auto;
        padding: env(safe-area-inset-top, 0) 16px calc(24px + env(safe-area-inset-bottom, 0));
        background: var(--bg); color: var(--text);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', system-ui, sans-serif;
        max-width: 760px;
      }
      header { padding: 20px 0 10px; }
      h1 { font-size: 19px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 24px 0 8px; color: var(--muted); font-weight: 600; }
      .sub { color: var(--muted); font-size: 13px; margin: 0; }
      .tabs { display: flex; gap: 6px; margin: 14px 0 16px; }
      .tab {
        flex: 1; padding: 9px 10px; border-radius: 10px; cursor: pointer;
        background: var(--card); border: 1px solid var(--line); color: var(--muted);
        font: inherit; font-size: 14px;
      }
      .tab[aria-selected='true'] { color: var(--text); border-color: var(--muted); font-weight: 600; }
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
      input, button {
        font: inherit; color: var(--text); background: var(--card);
        border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
      }
      input { min-width: 0; }
      #market-input { flex: 1 1 160px; }
      button { cursor: pointer; }
      button:hover { border-color: var(--muted); }
      button.link { background: none; border: none; color: var(--muted); padding: 2px 6px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
      .chip {
        display: inline-flex; align-items: center; gap: 4px;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 999px; padding: 5px 8px 5px 12px; font-size: 13px;
      }
      .chip button { background: none; border: none; padding: 0 2px; color: var(--muted); line-height: 1; cursor: pointer; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
      .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
      .coin { font-weight: 700; font-size: 17px; }
      .price, .num { font-variant-numeric: tabular-nums; }
      .gap { font-weight: 700; font-variant-numeric: tabular-nums; }
      .up { color: var(--up); } .down { color: var(--down); } .near { color: var(--near); }
      .meta { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
      .bar { height: 4px; background: var(--line); border-radius: 999px; margin-top: 10px; position: relative; overflow: hidden; }
      .bar span { position: absolute; inset-block: 0; background: currentColor; border-radius: 999px; }

      .range { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
      .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
      .tile-label { display: block; color: var(--muted); font-size: 12px; }
      .tile-value { display: block; font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }

      .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
      th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 600; }
      td.num, th.num { text-align: right; }
      td.strong { font-weight: 700; }
      .scroll-hint { display: none; color: var(--muted); font-size: 12px; margin: 6px 2px 0; }
      @media (max-width: 620px) { .scroll-hint { display: block; } }

      .empty, .error, .note { color: var(--muted); font-size: 13px; padding: 14px 0; }
      .empty { text-align: center; }
      .error { color: var(--down); }
      footer { color: var(--muted); font-size: 12px; text-align: center; padding-top: 20px; }
    </style>
  </head>
  <body>
    <header>
      <h1>업비트 이평선 감시</h1>
      <p class="sub" id="subtitle">불러오는 중…</p>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab" data-tab="current" role="tab" aria-selected="true">현재</button>
      <button class="tab" data-tab="today" role="tab" aria-selected="false">오늘</button>
      <button class="tab" data-tab="week" role="tab" aria-selected="false">이번 주</button>
    </div>

    <div id="watchlist">
    <div class="toolbar">
      <input id="market-input" list="market-list" placeholder="코인 추가 (예: BTC)" autocomplete="off" />
      <button id="add">추가</button>
      <button id="refresh">새로고침</button>
    </div>
    <div class="chips" id="chips"></div>
    </div>
    <datalist id="market-list"></datalist>

    <main>
      <section id="tab-current"><div id="cards"></div></section>
      <section id="tab-review" hidden></section>
    </main>

    <footer>알림은 텔레그램 · 이 화면은 현황 확인과 회고용</footer>

    <script type="module" src="./app.js"></script>
  </body>
</html>
