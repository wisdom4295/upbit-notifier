name: Deploy PWA

on:
  push:
    branches: [main]
    paths-ignore: ['state.json', 'README.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages는 Settings → Pages → Source: GitHub Actions 에서 한 번 켜 줘야 한다.
      # Actions 토큰으로는 사이트 생성이 허용되지 않아(enablement로도 불가),
      # 꺼져 있으면 여기서 "Resource not accessible by integration" 으로 멈춘다.
      - uses: actions/configure-pages@v5
      # PWA가 src/indicators.js와 config.json을 그대로 참조하므로 레포 루트를 통째로 배포한다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
